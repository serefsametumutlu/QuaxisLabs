# dayanır (borsaistanbul.com/files/pay-piyasasi-{yıl}-yili-tatil-tablosu.pdf),
# WebSearch ile 2026-08-27 tarihinde doğrulandı.
#
# 2027: Borsa İstanbul bu yazının yazıldığı tarihte (2026-08-27) henüz 2027
# resmi tatil takvimini yayınlamamıştı. Sabit tarihli (millî/resmî) tatiller
# kesindir; dinî bayramların (Ramazan/Kurban) tarihleri Diyanet'in ay
# takvimine dayalı ÖNGÖRÜSÜdür — confirmed: false ile işaretlendi. Borsa
# İstanbul 2027 takvimini yayınladığında borsaistanbul.com/en/official-holidays
# üzerinden doğrulanıp bu dosya güncellenmeli.
#
# half_day: true → BIST'te yarım gün seansı (arife), kapanış 12:40 (bkz.
# tlab/data/calendar.py:_BIST_HALF_DAY_CLOSE).
