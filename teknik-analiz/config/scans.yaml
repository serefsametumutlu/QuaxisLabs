# tlab scan --preset <ad> tarafından okunur. Bir preset, indikatör listesini
# ve (opsiyonel) sonuç filtresini bir arada tanımlar — CLI'da tekrar tekrar
# --indicators/--filter yazmamak için (bkz. tlab/cli.py::scan_cmd).
#
# filter.break_types: yalnızca `trend.breakouts` sinyallerinin
# payload["break_type"] alanına uygulanır. filter.events/zone_kind/fresh
# GENEL bir mekanizmadır (bkz. tlab/cli.py::_signal_passes_filter) —
# payload["event"]/payload["zone_kind"]/payload["fresh"] alanlarına bakar,
# herhangi bir indikatörle çalışır. Hiçbiri verilmezse filtre uygulanmaz.
presets:
  dusen_kiran:
    description: "Düşüş trendini kıran hisseler (downtrend_break)"
    indicators: ["trend.breakouts"]
    filter:
      break_types: ["downtrend_break"]
  golden_zone:
    description: "Altın bölgede reaksiyon veren hisseler (structure.golden_zone)"
    indicators: ["structure.golden_zone"]
    filter:
      events: ["golden_zone_reaction"]
  demand_taze:
    description: "Yeni doğmuş, henüz test edilmemiş talep bölgeleri (structure.supply_demand)"
    indicators: ["structure.supply_demand"]
    filter:
      events: ["sd_new"]
      zone_kind: ["demand"]
      fresh: true
  kanal_dibi_hafta:
    description: "Haftalık regresyon kanalının dibine yakın hisseler (trend.weekly_channel, --tf w1 ile)"
    indicators: ["trend.weekly_channel"]
    filter:
      events: ["channel_bottom_touch"]
  tobo_onay:
    description: "Boynu kırarak onaylanan TOBO/OBO formasyonları (patterns.head_shoulders)"
    indicators: ["patterns.head_shoulders"]
    filter:
      events: ["tobo_confirmed", "obo_confirmed"]
  cift_tepe_dip:
    description: "Boynu kırarak onaylanan çift tepe/çift dip formasyonları (patterns.double_top_bottom)"
    indicators: ["patterns.double_top_bottom"]
    filter:
      events: ["double_top_confirmed", "double_bottom_confirmed"]
  takoz_bayrak:
    description: "Onaylanmış takoz/üçgen/bayrak/flama kırılımları (patterns.wedge, patterns.triangle, patterns.flag_pennant)"
    indicators: ["patterns.wedge", "patterns.triangle", "patterns.flag_pennant"]
    filter:
      events:
        [
          "falling_wedge_confirmed", "rising_wedge_confirmed",
          "sym_triangle_confirmed", "asc_triangle_confirmed", "desc_triangle_confirmed",
          "bayrak_confirmed", "flama_confirmed",
        ]
  # Faz 8D — "universe" kategorisi (momentum.alpha_rank/momentum_rank):
  # scanner motoru bunları evrenin TAMAMI için TEK işte çalıştırır (bkz.
  # tlab/scanner/engine.py::_run_universe_worker), sonuç yine sembol
  # başına düz sinyal satırına açılır — filtre mekanizması diğer
  # preset'lerle AYNIDIR.
  alpha_top:
    description: "Alfa sıralamasının ilk %10'una YENİ giren (likit) hisseler (momentum.alpha_rank)"
    indicators: ["momentum.alpha_rank"]
    filter:
      events: ["alpha_entry"]
  momentum_top:
    description: "Momentum sıralamasının ilk %10'una YENİ giren ya da yeni RS (52h) zirvesi yapan hisseler (momentum.momentum_rank)"
    indicators: ["momentum.momentum_rank"]
    filter:
      events: ["momentum_top_entry", "rs_breakout"]
  # Faz 8E — `pair.vol_harvest` bir "pair" indikatörüdür (needs_context), bu
  # yüzden bu preset `tlab scan` yerine `--pairs` (config/pairs.yaml) ile
  # verilen çiftlerde çalışır (diğer pair preset'leriyle AYNI mekanizma).
  hasat_duraklatildi:
    description: "Kointegrasyon/oynaklık rejimi bozulduğu için REBALANS DURDURULMUŞ çiftler (pair.vol_harvest)"
    indicators: ["pair.vol_harvest"]
    filter:
      events: ["harvest_paused"]
  hasat_devam:
    description: "Duraklamadan ÇIKIP rebalansa yeniden başlayan çiftler (pair.vol_harvest)"
    indicators: ["pair.vol_harvest"]
    filter:
      events: ["harvest_resumed"]
  # `confluence` gerçek bir katalog indikatörü DEĞİLDİR (bkz. tlab/scanner/
  # confluence.py) — `tlab eod --build-reversal-maps` ile ÜRETİLİP AYNI
  # results.db'ye yazılır, bu preset'ler `tlab scan`'de DEĞİL yalnızca
  # `tlab signals --indicator confluence` ya da EOD raporunun "Dipte Olası"
  # sekmesinde anlamlıdır.
  dipte_olasi:
    description: "Çoklu kaynak (arz/talep, golden zone, POC/VAH/VAL, harmonik PRZ, AB=CD hedefi) desteğine denk gelen olası dip bölgeleri (confluence)"
    indicators: ["confluence"]
    filter:
      events: ["reversal_confluence"]
      expr: "bottom_probability >= 0.5 and n_sources >= 3"
  # Faz 0.5, A4 (STRATEJI_DENETIM_TAM.md): 5 formasyon modülünün hepsinde
  # volume_ok/volume_profile_ok ZATEN hesaplanıp payload'a yazılıyordu ama
  # hiçbir sinyali filtrelemiyordu. `require_volume_confirm=True` (indikatör
  # parametresi, varsayılan KAPALI) sinyali kaynağında bastırırken, bu
  # preset AYNI bilgiyi mevcut (indikatör parametrelerine dokunmayan)
  # preset/expr mekanizmasıyla SUNUM katmanında filtreler -- iki modül
  # farklı payload anahtarı kullandığı için (`volume_ok` vs
  # `volume_profile_ok`) `or` ile ikisi birden kontrol edilir; ilgisiz
  # anahtar bir indikatörün payload'ında yoksa `filter_expr.py` bunu
  # None/False sayar (hata fırlatmaz).
  hacim_onayli:
    description: "Kırılım hacmi ortalamanın üstünde olan onaylanmış formasyonlar (5 patterns.* göstergesi)"
    indicators:
      [
        "patterns.head_shoulders", "patterns.double_top_bottom",
        "patterns.wedge", "patterns.triangle", "patterns.broadening",
        "patterns.flag_pennant",
      ]
    filter:
      events:
        [
          "tobo_confirmed", "obo_confirmed",
          "double_top_confirmed", "double_bottom_confirmed",
          "falling_wedge_confirmed", "rising_wedge_confirmed",
          "sym_triangle_confirmed", "asc_triangle_confirmed", "desc_triangle_confirmed",
          "broadening_top_confirmed", "broadening_bottom_confirmed",
          "bayrak_confirmed", "flama_confirmed",
        ]
      expr: "volume_ok == True or volume_profile_ok == True"
