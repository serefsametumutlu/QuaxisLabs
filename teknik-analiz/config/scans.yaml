# tlab scan --preset <ad> tarafından okunur. Bir preset, indikatör listesini
# ve (opsiyonel) sonuç filtresini bir arada tanımlar — CLI'da tekrar tekrar
# --indicators/--filter yazmamak için (bkz. tlab/cli.py::scan_cmd).
#
# filter.break_types: yalnızca `trend.breakouts` sinyallerinin
# payload["break_type"] alanına uygulanır. filter.events/zone_kind/fresh
# GENEL bir mekanizmadır (bkz. tlab/cli.py::_signal_passes_filter) —
# payload["event"]/payload["zone_kind"]/payload["fresh"] alanlarına bakar,
# herhangi bir indikatörle çalışır. Hiçbiri verilmezse filtre uygulanmaz.
presets:
  dusen_kiran:
    description: "Düşüş trendini kıran hisseler (downtrend_break)"
    indicators: ["trend.breakouts"]
    filter:
      break_types: ["downtrend_break"]
  golden_zone:
    description: "Altın bölgede reaksiyon veren hisseler (structure.golden_zone)"
    indicators: ["structure.golden_zone"]
    filter:
      events: ["golden_zone_reaction"]
  demand_taze:
    description: "Yeni doğmuş, henüz test edilmemiş talep bölgeleri (structure.supply_demand)"
    indicators: ["structure.supply_demand"]
    filter:
      events: ["sd_new"]
      zone_kind: ["demand"]
      fresh: true
  kanal_dibi_hafta:
    description: "Haftalık regresyon kanalının dibine yakın hisseler (trend.weekly_channel, --tf w1 ile)"
    indicators: ["trend.weekly_channel"]
    filter:
      events: ["channel_bottom_touch"]
  tobo_onay:
    description: "Boynu kırarak onaylanan TOBO/OBO formasyonları (patterns.head_shoulders)"
    indicators: ["patterns.head_shoulders"]
    filter:
      events: ["tobo_confirmed", "obo_confirmed"]
  cift_tepe_dip:
    description: "Boynu kırarak onaylanan çift tepe/çift dip formasyonları (patterns.double_top_bottom)"
    indicators: ["patterns.double_top_bottom"]
    filter:
      events: ["double_top_confirmed", "double_bottom_confirmed"]
  takoz_bayrak:
    description: "Onaylanmış takoz/üçgen/bayrak/flama kırılımları (patterns.wedge, patterns.triangle, patterns.flag_pennant)"
    indicators: ["patterns.wedge", "patterns.triangle", "patterns.flag_pennant"]
    filter:
      events:
        [
          "falling_wedge_confirmed", "rising_wedge_confirmed",
          "sym_triangle_confirmed", "asc_triangle_confirmed", "desc_triangle_confirmed",
          "bayrak_confirmed", "flama_confirmed",
        ]
