# 2026-09-03: Kaynak Fintables Sektörler sayfası (fintables.com/sektorler,
# 13 Ağustos 2026 itibarıyla) — kullanıcının kendi eklediği
# bist-sektorler-ve-hisseler.md dosyasından üretildi (tlab/../../ üretim
# script'i, elle YAZILMADI). 648 BIST hissesinin 637'si (44 sektör) burada;
# 11'i (Fintables'ta da) sektörü tanımsız olduğu için BİLİNÇLİ OLARAK
