# same_sector_only=True iken otomatik dışlar — "bilmediğin sektörü uydurma"
# ilkesi, bkz. discovery.py docstring'i). Önceki sürüm yalnızca ~23 sembol
# (8 sektör) içeren KASITLI kısmi bir başlangıç listesiydi; bu güncelleme
