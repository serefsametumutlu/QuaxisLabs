[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlab"
version = "0.1.0"
description = "Teknik Lab — non-repainting çoklu zaman dilimi indikatör tarama laboratuvarı"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "pyarrow",
    "plotly",
    "kaleido",
    "typer",
    "pyyaml",
    "statsmodels",
    "yfinance",
    "google-genai",
    "anthropic",
    "streamlit",
    "arch",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "hypothesis",
]

[project.scripts]
tlab = "tlab.cli:app"

[tool.setuptools.packages.find]
include = ["tlab*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Ortamda yalnızca Python 3.14 mevcut (bkz. CLAUDE.md); 3.11 bırakılırsa
# numpy'nin stub dosyaları (PEP 695 `type` ifadesi, 3.12+) mypy'yi kırıyor.
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: gerçek ağ bağlantısı gerektiren testler (varsayılan dışı, elle çalıştırılır)",
]
